[project]
name = "casepath"
version = "0.1.0"
description = "CasePath: agents prepare a legal-protection case from its files, grounded in quotes that a checker verifies"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pypdf>=5",
  "python-multipart>=0.0.9",
  "reportlab>=4",
  "pillow>=10.1",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casepath*"]

[tool.setuptools.package-data]
casepath = ["web/ui/*.html", "web/ui/assets/*", "web/ui/assets/fonts/*", "process/knowledge_seed/*.json"]
