[project]
name = "casepath-internal"
version = "0.1.0"
description = "CasePath for internal deployment: source-grounded workflows, an agent on Azure OpenAI, a fresh case store"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pypdf>=5",
  "python-multipart>=0.0.9",
  "reportlab>=4",
  "pillow>=10.1",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casepath_internal*"]

[tool.setuptools.package-data]
casepath_internal = ["ui/*.html", "ui/assets/*"]
