# CasePath as a Databricks App. Fill in the three marked values in the deployed copy only, never in Git.
command: ["python", "-m", "casepath_internal", "serve", "--host", "0.0.0.0"]
env:
  # Who may use it: Databricks signs people in and passes their e-mail; CasePath admits only the pilot group.
  - name: CASEPATH_IDENTITY_HEADER
    value: X-Forwarded-Email
  - name: CASEPATH_ALLOWED_USERS
    value: "FILL-IN: comma-separated e-mail addresses of the pilot group"
  # The model, from the workspace's Unity Gateway, signed in as the app's own service principal; sparing by design.
  - name: CASEPATH_MODEL_PROVIDER
    value: databricks
  - name: CASEPATH_MODEL
    value: "FILL-IN: the gateway model's exact name, as its Use/Query panel shows it"
  # app: the app's own service principal calls the model. user: each person's own token does (enable user
  # authorization for the app so Databricks forwards it); use it when the service principal may not query the model.
  - name: CASEPATH_MODEL_AUTH
    value: app
  # messages: the model's native Messages API on the gateway (/ai-gateway/anthropic/v1/messages), which passes forced
  # tool calls and prompt caching. chat: the OpenAI-compatible route (/ai-gateway/mlflow/v1/chat/completions).
  - name: CASEPATH_MODEL_API
    value: messages
  # The gateway refuses tool_choice "tool" and "any": offer only the tool that must be called, and say so.
  - name: CASEPATH_MODEL_FORCED_TOOLS
    value: "false"
  - name: CASEPATH_MODEL_MAX_OUTPUT_TOKENS
    value: "8000"
  # Scanned pages are read from images; 1400 px on the long side keeps typed text legible at fewer tokens per page.
  - name: CASEPATH_PAGE_IMAGE_SIDE
    value: "1400"
  # A run stops with a stated reason once it has used this many tokens (input not read from the cache, and output);
  # 0 means no limit.
  - name: CASEPATH_RUN_TOKEN_BUDGET
    value: "3000000"
  - name: CASEPATH_RUN_WORKERS
    value: "1"
  - name: CASEPATH_READING_WORKERS
    value: "2"
  # Cases live on a Unity Catalog volume; the app's own disk is only a working copy. Case files placed in the volume's
  # incoming/ folder (Catalog Explorer takes large uploads) are listed on the Cases page for one-click import.
  - name: CASEPATH_DATA_DIR
    value: /tmp/casepath-data
  - name: CASEPATH_VOLUME
    value: "FILL-IN: /Volumes/<catalog>/<schema>/<volume>"
  - name: CASEPATH_WORKFLOW_CATALOGUE
    value: catalogue
  - name: CASEPATH_SEED_SUITE
    value: benchmark
