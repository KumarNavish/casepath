$('stepcount').textContent=`${m.done.size} of ${nodes.length} steps`;$('graph').style.setProperty('--nodes',nodes.length);$('graph').innerHTML=nodes.map(n=>{const done=m.done.has(n.node_id),active=!result&&!done&&node?.node_id===n.node_id;return `<li class="node ${m.active.has(n.node_id)?'in':''} ${done?'done':''} ${active?'active':''}" data-node="${h(n.node_id)}"><span class="fill"></span><span class="c">${done?'✓':''}</span><button class="link lb" data-node-source="${h(n.node_id)}">${h(n.label)}</button><div class="ev">${arr(n.document_types).map(t=>`<button class="link ${m.received.has(t)?'ok':''}" data-document-source="${h(t)}">${h(docLabel(t))} · ${m.received.has(t)?'received ✓':m.required.has(t)?'needed':'to check'}</button>`).join('')}<span class="law">${h(law([...(m.laws.get(n.node_id)||[])]))}</span></div></li>`;}).join('');
const reuse=m.reuse;$('reuse').textContent=reuse?`Built on ${DOMAIN[state.graph?.family]||'a procedure'} v${reuse.input.version}, learned from earlier cases${reuse.result?.reused_evidence_recipes?` · ${reuse.result.reused_evidence_recipes} document checks reused`:''}`:'';$('reuse').hidden=!reuse;

$('badge').textContent=result?'Rulebook':op?.kind==='fact.extract'?check?'Checker':'Reader':op?.kind==='document.check'?'Checker':op?.kind==='step.complete'?'Rulebook':op?.kind==='knowledge.reuse'?'Memory':'CasePath';

$('reading-title').textContent=result?'Recorded result':inspect?'Cited source':'Reading now';$('source').hidden=result;$('found').hidden=result;$('result').hidden=!result;$('back').hidden=!(finished&&inspect);$('result').innerHTML=result?renderResult():'';
if(!result){renderSource(op);const label=pred?`${words(op.object.id)} (${law(op.input.rule_refs)})`:arr(state.facts).find(f=>f.fact_id===op?.object?.id)?.label||(op?.input?.document_type?docLabel(op.input.document_type):'');$('found').innerHTML=op?.kind==='fact.extract'?`${check?'Confirmed':pred?'Legal test':'Found'} · <b>${h(label)}</b>${node?`<span class="feed">feeds the step “${h(node.label)}”</span>`:''}`:op?.kind==='document.check'?`Accepted · <b>${h(docLabel(op.object.id))}</b>`:'';}
$('pos').textContent=`Case ${selectedCase+1} of 9`;$('pips').innerHTML=ROSTER.map((_,i)=>`<span class="pip ${i<selectedCase?'done':i===selectedCase?'now':''}"></span>`).join('');$('prog').style.transform=`scaleX(${(selectedCase+(finished?1:m.done.size/Math.max(1,nodes.length)))/9})`;$('pause').hidden=finished;$('skip').hidden=finished;$('watch').hidden=!finished;$('pause').textContent=paused?'Resume':'Pause';$('choose').value=selectedCase;

function drawThread(op){const mark=$('quote'),node=nodeFor(op),target=node&&document.querySelector(`[data-node="${node.node_id}"] .lb`),svg=$('thread'),pane=$('scroll');if(!mark||!target||!pane||motion.matches)return null;
const main=$('main').getBoundingClientRect(),p=pane.getBoundingClientRect(),rs=[...mark.getClientRects()].filter(r=>r.bottom>p.top+3&&r.bottom<p.bottom-3),a=rs.at(-1),b=target.getBoundingClientRect(),card=mark.closest('.doc').getBoundingClientRect();if(!a)return null;
const x1=a.right-main.left,y1=a.bottom-main.top+2,x2=b.left-main.left-6,y2=b.top-main.top+9;
let d;if(document.body.dataset.option==='C'){const lane=document.querySelector('.process-col').getBoundingClientRect().bottom-main.top+8;d=`M${x1} ${y1} L${card.right-main.left+12} ${y1} L${card.right-main.left+12} ${lane} L${x2-8} ${lane} L${x2-8} ${y2} L${x2} ${y2}`;}else{d=`M${x1} ${y1} C${card.right-main.left+10} ${y1},${x2-18} ${y2},${x2} ${y2}`;}
svg.setAttribute('viewBox',`0 0 ${main.width} ${main.height}`);svg.innerHTML=`<path pathLength="1" d="${d}"/><circle cx="${x1}" cy="${y1}" r="3"/><circle cx="${x2}" cy="${y2}" r="3"/>`;return svg.querySelector('path');}
async function animate(el,frames,ms){if(!el||motion.matches||paused||document.hidden)return;const a=el.animate(frames,{duration:ms/speed,easing:'cubic-bezier(.2,.65,.3,1)'});animations.push(a);try{await a.finished;}catch{}}
async function cue(op){if(motion.matches)return;const serial=token;if(op?.source){await animate($('quote'),[{backgroundColor:'transparent'},{backgroundColor:'#e1e8db'}],450);if(serial!==token||paused)return;const path=drawThread(op);await animate(path,[{strokeDashoffset:1},{strokeDashoffset:0}],650);await animate($('found'),[{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'none'}],250);}if(op?.kind==='step.complete'){const el=document.querySelector(`[data-node="${op.object.id}"]`);await animate(el?.querySelector('.c'),[{transform:'scale(.4)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],350);await animate(el?.querySelector('.fill'),[{transform:document.body.dataset.option==='C'?'scaleX(0)':'scaleY(0)'},{transform:'scale(1)'}],500);}else if(op?.kind==='node.evaluate'){await animate(document.querySelector(`[data-node="${op.object.id}"] .c`),[{transform:'scale(.4)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],450);}else if(op?.kind==='knowledge.reuse'){await animate($('reuse'),[{opacity:0},{opacity:1}],400);}}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function gatedWait(ms,t){let elapsed=0;while(elapsed<ms){if(t!==token)return false;await delay(80);if(!paused&&!document.hidden)elapsed+=80*speed;}return t===token;}
async function play(){const t=token;for(let i=position+1;i<ops.length;i++){if(t!==token)return;while(paused||document.hidden){await delay(100);if(t!==token)return;}const op=ops[i];position=i;const visible=op.kind==='fact.extract'&&op.source||op.kind==='source.open'||op.kind==='knowledge.reuse'||op.kind==='document.check'&&op.result?.assessment==='sufficient'||op.kind==='step.complete'&&op.result?.status==='completed'||op.kind==='node.evaluate'&&op.result?.activation==='true'&&!lastModel?.active.has(op.object.id);if(!visible)continue;selectedOp=op;render(op);await cue(op);if(!await gatedWait(op.kind==='fact.extract'?1900:op.kind==='source.open'?750:550,t))return;}
if(t!==token)return;finished=true;selectedOp=null;render();await animate($('result'),[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],450);if(!q.has('frame')&&!motion.matches&&await gatedWait(8000,t)&&selectedCase<8)load(selectedCase+1);}
async function load(i,mode=q.get('frame')){const t=++token;stopMotion();loaded=false;selectedCase=i;finished=false;paused=false;position=-1;selectedOp=null;document.body.dataset.ready='false';$('title').textContent='Opening the recorded case…';try{const responses=await Promise.all([fetch(`${API}/claims/${ROSTER[i]}`),fetch(`${API}/claims/${ROSTER[i]}/operations?mode=live`)]);if(responses.some(r=>!r.ok))throw new Error('Recorded preview unavailable');const [packet,raw]=await Promise.all([responses[0].json(),responses[1].text()]);if(t!==token)return;state=packet.state;const frames=raw.trim().split('\n').map(JSON.parse);ops=frames.filter(r=>r.type==='operation');const end=frames.findLast(r=>r.type==='result');if(!end||end.exact_output_verified!==true||end.state_sha256!==state.state_sha256)throw new Error('Recorded operations do not match the saved case');sources=new Map();for(const op of ops)if(op.kind==='source.open')sources.set(op.object.id,{...op.result,artifact_id:op.object.id});const groups=new Map();fileById=new Map();for(const s of arr(state.source_descriptors)){const key=s.role+'|'+s.file_name;if(!groups.has(key))groups.set(key,{...s,key,ids:[]});const f=groups.get(key);f.ids.push(s.artifact_id);fileById.set(s.artifact_id,f);}files=[...groups.values()];docByQuote=new Map();for(const op of ops)if(op.kind==='fact.extract'&&op.input?.document_type&&op.source?.quote&&!docByQuote.has(op.source.quote))docByQuote.set(op.source.quote,op.input.document_type);loaded=true;
if(mode==='result'||motion.matches){position=ops.length-1;finished=true;render();}else if(mode==='work'){const candidates=ops.map((op,i)=>({op,i})).filter(({op})=>op.kind==='fact.extract'&&Array.isArray(op.input?.rule_refs)&&op.source);position=candidates[Math.floor(candidates.length/2)]?.i??-1;if(position<0)position=ops.findIndex(op=>op.kind==='fact.extract'&&op.source);selectedOp=ops[position];paused=true;render(selectedOp);drawThread(selectedOp);}else{render();play();}
}catch(e){if(t===token){$('title').textContent='The recorded preview could not open';$('source').innerHTML=`<p class="error">${h(e.message)}</p>`;document.body.dataset.error=e.message;throw e;}}}
function inspect(op){if(!op)return;paused=true;selectedOp=op;render(op,true);drawThread(op);}
$('choose').innerHTML=LABELS.map((label,i)=>`<option value="${i}">Case ${i+1} · ${h(label)}</option>`).join('');$('choose').addEventListener('change',e=>load(Number(e.target.value),'result'));
$('pause').onclick=()=>{paused=!paused;stopMotion();$('pause').textContent=paused?'Resume':'Pause';if(!paused&&q.get('frame')==='work'){token++;play();}};
$('skip').onclick=()=>{token++;stopMotion();position=ops.length-1;finished=true;paused=false;selectedOp=null;render();};$('watch').onclick=()=>load(selectedCase,'play');$('back').onclick=()=>{selectedOp=null;render();};
$('close').onclick=()=>$('dialog').close();$('cases').onclick=()=>{$('choose').focus();$('choose').showPicker?.();};$('about').onclick=()=>showDialog('A recorded design study','<p>This standalone prototype reads the nine seeded synthetic cases. It sends no writes and does not run a model. Counts come from recorded operations: distinct files with a span.read, unverified fact.extract entries, rule checks, and distinct completed process steps.</p><p>Select a file, step or legal test to inspect its recorded source. These concepts are awaiting a design choice.</p>');
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||!loaded)return;if(el.hasAttribute('data-file-source')){const f=fileById.get(el.dataset.fileSource),rows=ops.slice(0,position+1),op=rows.findLast(x=>x.source&&f.ids.includes(x.source.artifact_id))||rows.findLast(x=>x.kind==='source.open'&&f.ids.includes(x.object.id));if(op)inspect(op);else if(f.role==='customer_message'){paused=true;selectedOp=null;render(null,true);}else showDialog(fileLabel(f),'<p>This file has not been opened in the recording yet.</p>');}else if(el.hasAttribute('data-node-source')){const op=lastModel.evidence.get(el.dataset.nodeSource);if(op)inspect(op);else showDialog('Process step','<p>No cited source has been recorded for this step yet.</p>');}else if(el.hasAttribute('data-document-source')){const op=ops.slice(0,position+1).findLast(x=>x.source&&(x.kind==='document.check'&&x.object.id===el.dataset.documentSource||x.kind==='fact.extract'&&x.input?.document_type===el.dataset.documentSource));if(op)inspect(op);}else if(el.hasAttribute('data-predicate-source')){const p=arr(state.outcome.legal_predicates).find(p=>p.predicate_id===el.dataset.predicateSource),op=ops.findLast(x=>x.kind==='fact.extract'&&x.source&&arr(p?.citations).some(c=>c.quote===x.source.quote&&c.artifact_id===x.source.artifact_id));if(op)inspect(op);}else if(el.hasAttribute('data-draft')){const d=state.outcome.request_draft;showDialog('Draft letter',`<p class="eyebrow">Draft, not sent · a person decides</p><h3>${h(d.subject)}</h3><pre>${h(d.body)}</pre>`);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMotion();});motion.addEventListener('change',()=>{if(motion.matches&&loaded){token++;position=ops.length-1;finished=true;selectedOp=null;render();}});
// Read-only inspection surface for reproducible capture receipts.
window.designStudy={snapshot:()=>({case: selectedCase+1,frame:document.body.dataset.frame,operation:document.body.dataset.operation,position,operationCount:ops.length,counts:lastModel?{files:lastModel.read.size,facts:lastModel.facts,rules:lastModel.rules,steps:lastModel.done.size,total:state.graph.nodes.length}:null,sourceCommit:state.source_commit||null,stateSha:state?.state_sha256}),load};
