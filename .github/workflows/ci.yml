name: CasePath CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casepath-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: CasePath regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      # The migration audit must inspect every process owned by the product
      # user. GitHub's runner service account has protected unrelated processes.
      # A dedicated unprivileged user preserves the full audit and closes the
      # credential environment without changing host security settings.
      - name: Create an isolated unprivileged product test account
        run: |
          sudo useradd --create-home --uid 20001 --shell /bin/bash casepath-ci
          sudo install -m 755 "$(command -v uv)" /usr/local/bin/uv
          sudo cp -a "$GITHUB_WORKSPACE" /home/casepath-ci/repository
          sudo chown -R casepath-ci:casepath-ci /home/casepath-ci/repository
          # Runner checkout ACLs must not be inherited by sealed product files.
          # Restrict this normalization to the disposable test account's home.
          sudo setfacl --remove-all --recursive /home/casepath-ci
          sudo setfacl --remove-default --recursive /home/casepath-ci
          sudo chmod 0700 /home/casepath-ci
      # The launcher validates the sealed source and supplies Python 3.13.9,
      # locked dependencies, temporary data, and a closed credential environment.
      - name: Prepare the exact source capsule
        run: >-
          sudo -u casepath-ci /usr/bin/env -i HOME=/home/casepath-ci
          PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          /bin/bash --noprofile --norc -c
          'cd /home/casepath-ci/repository && exec ./bin/casepath prepare'
      - name: Verify the migration regressions in the isolated account
        run: >-
          sudo -u casepath-ci /usr/bin/env -i HOME=/home/casepath-ci
          PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PYTHONPATH=casepath-api PYTHONDONTWRITEBYTECODE=1
          /bin/bash --noprofile --norc -c
          'cd /home/casepath-ci/repository && exec
          .runtime/casepath-dev-v2/venv/bin/python -m pytest -q
          casepath-api/tests/test_local_data_root.py'
      - name: Run isolated deterministic product regressions
        run: >-
          sudo -u casepath-ci /usr/bin/env -i HOME=/home/casepath-ci
          PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          /bin/bash --noprofile --norc -c
          'cd /home/casepath-ci/repository && exec ./bin/casepath test'
