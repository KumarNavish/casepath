name: Product quality preview
on:
  push:
    branches: [product/release-quality-20260922-1941]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: casepath-product-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1786406400'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare exact deterministic product and inspect it
        run: bash .github/product-quality/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casepath-product-quality-${{ github.sha }}
          path: ${{ runner.temp }}/product-quality/
          retention-days: 1
          if-no-files-found: error
