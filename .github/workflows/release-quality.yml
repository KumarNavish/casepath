name: CasePath release-quality verification

on:
  push:
    branches: [release/product-quality-20260922-1822]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casepath-release-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-baseline:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install the launcher dependency
        run: python3 -m pip install --disable-pip-version-check uv==0.10.0
      - name: Prepare the unchanged, pinned product
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/casepath-browser"
          ./bin/casepath prepare 2>&1 | tee "$RUNNER_TEMP/casepath-browser/prepare.log"
      - name: Install the repository's browser QA dependencies
        working-directory: casepath-qa
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Exercise a real isolated claim and capture its baseline
        run: node .github/qa/release-browser.mjs "$RUNNER_TEMP/casepath-browser"
      - name: Preserve exact source identity and observed results
        if: always()
        run: |
          git cat-file commit HEAD > "$RUNNER_TEMP/casepath-browser/head.commit"
          git status --short > "$RUNNER_TEMP/casepath-browser/source-status.txt"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: casepath-browser-${{ github.sha }}
          path: ${{ runner.temp }}/casepath-browser/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
